name = "binzhou-index"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "binzhou-db"
database_id = "89076eca-69b1-45f4-8240-e93e971182bb"

[[kv_namespaces]]
binding = "CACHE"
id = "dc005cbffc584501bd1af9b19309c997"

[vars]
IMAGE_ORIGIN = "https://cheats-nokia-spokesman-mat.trycloudflare.com"
AI_HUB_URL = ""

[env.preview.vars]
PREVIEW_READ_ONLY = "true"
IMAGE_ORIGIN = "https://cheats-nokia-spokesman-mat.trycloudflare.com"
AI_HUB_URL = ""

[[env.preview.d1_databases]]
binding = "DB"
database_name = "binzhou-db"
database_id = "89076eca-69b1-45f4-8240-e93e971182bb"

[[env.preview.kv_namespaces]]
binding = "CACHE"
id = "dc005cbffc584501bd1af9b19309c997"

# JWT_SECRET and AI_HUB_KEY remain encrypted dashboard secrets.
# Preview shares published data, but all application writes are denied.
