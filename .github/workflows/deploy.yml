name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked build dependencies
        run: npm ci --prefix edge
      - name: Typecheck, build and regression tests
        run: |
          npm run typecheck
          npm run build
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: pages-worker
          path: dist
          retention-days: 14
      - name: Check Cloudflare credentials
        run: node ops/check-cloudflare-auth.mjs
        env:
          CF_CURRENT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_CURRENT_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_LEGACY_TOKEN: ${{ secrets.CLOUDFLAREAPITOKEN }}
          CF_LEGACY_ACCOUNT: ${{ secrets.CLOUDFLAREACCOUNTID }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_DEPLOY_TOKEN }}
          accountId: ${{ env.CF_DEPLOY_ACCOUNT }}
          wranglerVersion: '4.141.0'
          command: pages deploy dist --project-name=binzhou-index --branch=${{ github.ref_name }}



